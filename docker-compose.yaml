version: "3"
services:
  migrations:
    build: .
    platform: linux/arm64
    volumes:
      - media_data:/home/mediacms.io/mediacms/media
      - static_data:/home/mediacms.io/mediacms/static
    environment:
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_CELERY_BEAT: 'no'
    command: "./deploy/docker/prestart.sh"
    restart: on-failure
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }

  web:
    build: .
    platform: linux/arm64
    expose:
      - "80"
    volumes:
      - media_data:/home/mediacms.io/mediacms/media
      - static_data:/home/mediacms.io/mediacms/static
    environment:
      ENABLE_CELERY_BEAT: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_MIGRATIONS: 'no'
    depends_on:
      migrations:
        condition: service_completed_successfully

  celery_worker:
    build: .
    platform: linux/arm64
    volumes:
      - media_data:/home/mediacms.io/mediacms/media
      - static_data:/home/mediacms.io/mediacms/static
    environment:
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_BEAT: 'no'
      ENABLE_MIGRATIONS: 'no'
    depends_on:
      migrations:
        condition: service_completed_successfully

  celery_beat:
    build: .
    platform: linux/arm64
    volumes:
      - media_data:/home/mediacms.io/mediacms/media
      - static_data:/home/mediacms.io/mediacms/static
    environment:
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_MIGRATIONS: 'no'
    depends_on:
      - redis

  db:
    image: postgres:17.2-alpine
    platform: linux/arm64
    volumes:
      - db_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: mediacms
      POSTGRES_PASSWORD: mediacms
      POSTGRES_DB: mediacms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d mediacms -U mediacms"]
      interval: 10s
      retries: 5

  redis:
    image: redis:alpine
    platform: linux/arm64
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

volumes:
  media_data:
  static_data:
  db_data:
